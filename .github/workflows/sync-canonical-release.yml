name: sync-canonical-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published canonical vX.Y.Z release (empty selects latest)
        required: false
        type: string
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: legacy-release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Synchronize released Go module
        id: sync
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: ./scripts/sync-release.sh "$TARGET_VERSION"
      - name: Publish legacy archive names
        env:
          RELEASE_VERSION: ${{ steps.sync.outputs.version }}
        run: python3 scripts/release-assets.py "$RELEASE_VERSION"
